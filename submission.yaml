submission:
  title: "TitanSafe — Privacy-Preserving Social Media Threat Intelligence"

  problem_statement: >
    Law enforcement agencies (LEAs) investigating coordinated online incitement,
    doxxing, and election misinformation cannot get timely, actionable intelligence
    from social media platforms without demanding bulk raw data dumps — which violate
    India's DPDP Act 2023 and expose innocent users' private data.
    Platforms have no privacy-safe way to share exactly what investigators need
    and nothing more.

  solution_summary: >
    TitanSafe is a zero-dependency, pure-Python abstraction layer that runs
    inside the platform's trust boundary. It detects coordinated-inauthentic-behaviour
    (CIB) clusters, then releases evidence through three cryptographically gated tiers:
    ZK-proved threat signals (T0), pseudonymous redacted evidence (T1), and
    court-ordered identity reveals (T2). Every disclosure is Merkle-anchored,
    audited in a tamper-evident hash chain, and verifiable by the LEA without
    any platform access.

  key_features:
    - "Three-tier privacy-preserving disclosure: ZK proofs (T0) → pseudonymous evidence (T1) → court-ordered identity reveal (T2)"
    - "Coordinated-inauthentic-behaviour (CIB) detection with explainable signals (burst, youth, hashtag sync, similarity)"
    - "Cryptographic integrity: Pedersen commitments, Schnorr/range ZK proofs, sorted Merkle tree, tamper-evident audit chain"
    - "Comprehensive 11-section LEA dashboard with network graph, activity heatmap, platform analytics, risk gauges, sparklines, and collapsible cluster cards"
    - "Print-ready A4 PDF threat report with embedded SVG charts (donut, hbar, risk gauge, signal heatmap)"
    - "Seven named mock datasets (default, election_disinfo, communal_riot, journalist_doxxing, cyberattack_infra, stock_manipulation, exam_paper_leak)"
    - "Officer-friendly Flask web chat interface with IBM Bob API integration, FIR generation, and real-time streaming logs"

  tech_stack:
    languages: ["Python 3.10+"]
    frameworks: []
    ibm_technologies: ["IBM Bob (AI-assisted development and code review)"]
    databases: []
    other: ["Pure-Python elliptic-curve cryptography (no external deps)", "HTML/CSS/JS (self-contained dashboard)", "pytest"]

  what_we_are_most_proud_of: >
    The cryptographic privacy layer: the same Pedersen-commitment / Schnorr
    zero-knowledge proof stack from QBOM-ZT is repurposed to prove
    "at least k accounts in this threat cluster" without revealing the exact
    count or any identity. Combined with per-case HMAC pseudonyms (the same
    user looks different in every case, preventing cross-case linking) and
    Merkle-anchored post evidence, TitanSafe gives LEAs mathematically
    verifiable guarantees — not just a platform's word — that the evidence
    they received is authentic and hasn't been tampered with.

  known_limitations: >
    Mock data only — detection is lexicon-heuristic and would need tuned
    NLP models and Hinglish/regional-script coverage for production.
    Pure-Python EC crypto is a research prototype, not constant-time or
    audited; use vetted libraries (e.g., cryptography, coincurve) in
    production. The PDF report is browser-printed HTML, not a
    cryptographically signed document. DPDP Act s.17 exemptions may
    allow broader State access — this is compliance-by-design and
    misuse reduction, not a legal safe harbour.

